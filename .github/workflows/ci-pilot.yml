# Published into the public test mirror by tools/infra/mirror.mjs (#7585) as .github/workflows/ci-pilot.yml. One lockstep-pilot salt per job
# (tools/referee/lockstep/pilot.mjs --one <lane>:<salt>) on the pushed p/<id> snapshot; job i runs salt FROM+i of .pilot-args ("lane from n").
# Every job pushes pilot-<i>.json to r/<id>.<i>; the private side (mirror.mjs `pilot`) reads, validates and deletes the branches.
# The server jar comes from the private store at run time (STORE_URL secret), never from the repo. Nothing here may name the owner.
name: ci-pilot
on:
  push:
    branches: ['p/**']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          read lane from n idx < .pilot-args
          echo "matrix={\"i\":[$idx]}" >> "$GITHUB_OUTPUT"
  salt:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      MCLITE_HOSTED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: data
        env: { STORE_URL: '${{ secrets.STORE_URL }}' }
        run: node tools/cloud/bootstrap.mjs --store "$STORE_URL" --no-suite --no-build 2>&1 | tail -4 | sed -E 's#https?://[^ ]*@#https://***@#g'
      - name: salt
        continue-on-error: true
        run: |
          read lane from n idx < .pilot-args; i="${{ matrix.i }}"
          [ "$i" -lt "$n" ] || { echo "job $i beyond $n seeds"; exit 0; }
          mkdir -p pilot-out
          # a failure must show in the job log (#7585 proof run: 20 jobs "succeeded" in 10 s with no result because `| tail -1` hid the error)
          node tools/referee/lockstep/pilot.mjs --one "$lane:$((from + i))" --cache "$RUNNER_TEMP/pc" > pilot-out/full-$i.txt 2> pilot-out/err-$i.txt || { echo "job $i FAILED:"; tail -20 pilot-out/err-$i.txt; exit 1; }
          tail -1 pilot-out/full-$i.txt > pilot-out/pilot-$i.json
      - name: report
        if: always()
        run: |
          id="${GITHUB_REF_NAME#p/}"; i="${{ matrix.i }}"
          [ -s pilot-out/pilot-$i.json ] || { echo "job $i left no result"; exit 0; }
          cd "$RUNNER_TEMP" && rm -rf rep && mkdir rep && cd rep && git init -q
          cp "$GITHUB_WORKSPACE/pilot-out/pilot-$i.json" .
          git -c user.name=CI -c user.email=ci@invalid.invalid add -A
          git -c user.name=CI -c user.email=ci@invalid.invalid commit -qm "$id.$i"
          git -c credential.helper= push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/r/$id.$i"
