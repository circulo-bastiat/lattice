# Published into the lattice mirror (#8915). The 5-minute brain tick (#8893) off the PC: private checkout by PAT, brain.mjs
# health/fill (comment routing stays event-driven) against the private bus, usaged renewal + read, usage.json pushed to branch usage-data of the private repo.
# BRAIN_RUNNER=mirror|vm (repo variable, both repos): this side acts only when it is `mirror`; brain.yml on the VM no-ops then. Never both.
# #10419: ONE job is a CHAIN of ticks (every ~4 min for ~52 min), then it dispatches its own successor, because GitHub throttles `schedule` on this account (the */5 cron stays only as the
# backup that restarts a broken chain). Each tick: bus mail routed by POLLING (brain.mjs poll), the lander started (brain.mjs land), health, fill. Private-repo variables are read per tick.
# Silent (#8913): logs are public. Measure: runs/day, the [silent] elapsed seconds, gaps between run start times (missed ticks).
name: brain-tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: brain-tick
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tick:
    if: vars.BRAIN_RUNNER == 'mirror'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      MCLITE_HOSTED: '1'
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: checkout
        env: { PAT: '${{ secrets.MCLITE_PAT }}', SRC: '${{ secrets.MCLITE_SRC }}' }
        run: |
          silent() { local n="$1"; shift; "$@" >> "$RUNNER_TEMP/out.log" 2>&1; local rc=$?; echo "[silent] $n exit=$rc"; return $rc; }
          silent clone git -c credential.helper= clone -q "https://x-access-token:${PAT}@github.com/${SRC}.git" work
      - name: tick
        env:
          GH_TOKEN: ${{ secrets.MCLITE_PAT }}
          MCLITE_REPO: ${{ secrets.MCLITE_SRC }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}   # the fill dispatches worker packs and role runs on this repo
          MIRROR_REPO: ${{ github.repository }}
          CLAUDE_PROFILES: ${{ secrets.CLAUDE_PROFILES }}   # Claude logins as a lattice secret, unpacked by usaged; #10464: usaged is the ONLY renewer and writes the rotated login back here (MIRROR_TOKEN, secrets:write)
          TICK_WORKFLOW: ${{ github.workflow }}
        run: |
          . work/tools/infra/mirror/silent.sh
          # the successor is dispatched at the START (the concurrency group holds it pending behind this job and starts it the moment this one ends, however it ends:
          # a chain that timed out or died before a last-step dispatch left no chain and a 47 min fill-idle, 30 Oct) and again at the end in case that one failed
          silent next-early curl -fsS -X POST -H "Authorization: Bearer $MIRROR_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$MIRROR_REPO/actions/workflows/brain-tick.yml/dispatches" -d '{"ref":"main"}' || true
          T0=$(date +%s); N=0
          while :; do
            N=$((N+1)); S=$(date +%s)
            silent update bash -c 'git -C work fetch -q --depth 1 origin master && git -C work reset -q --hard FETCH_HEAD' || true
            silent vars bash work/tools/infra/mirror/tickvars.sh "$RUNNER_TEMP/vars.env" || true
            [ -s "$RUNNER_TEMP/vars.env" ] && . "$RUNNER_TEMP/vars.env"
            silent restore bash work/tools/infra/mirror/tick-state.sh restore || true
            export BRAIN_HOME="$PWD/ud/home"
            mkdir -p "$RUNNER_TEMP/proj/_status" "$PWD/ud/profiles"; export MCLITE_PROJECTS="$RUNNER_TEMP/proj" MCLITE_PROFILE_STATE="$PWD/ud/profiles"
            ( cd work
              silent usage node tools/usaged.mjs --once || true
              cp "$MCLITE_PROJECTS/_status/usage.json" usage.json 2>/dev/null || true
              silent relay node tools/infra/relaypoll.mjs || true   # #10420: relay.yml off the PC
              silent poll node tools/brain/brain.mjs poll || true
              silent land node tools/brain/brain.mjs land || true
              silent health node tools/brain/brain.mjs health --if-due || true
              silent fill node tools/brain/brain.mjs fill || true )
            silent publish bash work/tools/infra/mirror/tick-state.sh save || true
            [ $(( $(date +%s) - T0 )) -ge 3000 ] && break
            W=$(( 240 - ($(date +%s) - S) )); [ "$W" -gt 20 ] && sleep "$W"
          done
          silent next curl -fsS -X POST -H "Authorization: Bearer $MIRROR_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$MIRROR_REPO/actions/workflows/brain-tick.yml/dispatches" -d '{"ref":"main"}' || true
          echo "[silent] ticks=$N"
