# #7770: performance budget. After each landing on the public mirror's master (not per PR), run the headless bench on a
# free hosted runner, store the numbers keyed by sha on branch `bench-data`, and open a `perf-regression` issue when a
# landing is slower than max(3x spread, 10%) vs the median of the last 5. Alerts only: this job never blocks the lander, but it goes RED when it records nothing (#11386: Node 20 has no global WebSocket, so bench.mjs died on every run while continue-on-error painted it green).
name: bench
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: bench
permissions:
  contents: write
  issues: write
  pull-requests: read
jobs:
  bench:
    if: github.repository != 'never'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: store, path: _store }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # #11386: assets/ is generated, never in git; without it benchmicro/bench died on ENOENT block-geometry.meta.json
      # #11386: prep's own bootstrap cloned the private mclite-store over https and died 'Authentication failed' (no jars -> no assets); use the store branch like full-suite.yml
      - run: node tools/cloud/bootstrap.mjs --store "$GITHUB_WORKSPACE/_store" --no-suite --no-build 2>&1 | tail -5
      - run: node tools/go.mjs prep --dir .
      - run: node build.mjs
      # #11386: /usr/bin/chromium on the hosted image never opened the debug port; the preinstalled Google Chrome does
      - run: node tools/bench.mjs --preset low --json bench.json
        env: { MCLITE_PRESET: low, CHROME: /usr/bin/google-chrome }
      - name: chunk-gen microbench + 10-run spread on this runner (#7770)
        run: |
          node tools/benchmicro.mjs --reps 10 --spread 10 | tee spread.txt || true
          node tools/benchmicro.mjs --reps 10 --json micro.json
          node -e "const a=require('./bench.json'),m=require('./micro.json');a.runs.push(...m.runs);require('fs').writeFileSync('bench.json',JSON.stringify(a))"
      - name: record, gate, alert
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git -c credential.helper= fetch origin bench-data:bench-data 2>/dev/null && git show bench-data:store.json > store.json || echo '{"spread":{},"entries":[]}' > store.json
          PR=""
          if OUT=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null) && printf '%s' "$OUT" | grep -Eq '^[0-9]+$'; then PR="$OUT"; fi
          if [ -n "$PR" ]; then PRT=" (PR #$PR)"; else PRT=""; fi
          node tools/benchbudget.mjs record bench.json store.json ${{ github.sha }} "$PR"
          set +e; node tools/benchbudget.mjs gate store.json | tee gate.txt; RC=${PIPESTATUS[0]}; set -e
          if [ "$RC" = 3 ]; then gh issue create --title "perf-regression: ${GITHUB_SHA::9} $PRT" --label perf-regression --body "$(cat gate.txt)" || gh issue create --title "perf-regression: ${GITHUB_SHA::9} $PRT" --body "$(cat gate.txt)"; fi
          # #11386: `git rm -rf .` below deletes tools/, so the fresh-gate must run before it
          node tools/benchbudget.mjs fresh store.json ${{ github.sha }}
          mkdir -p /tmp/bd && cp store.json /tmp/bd/ && git checkout --orphan bench-data-new && git rm -rfq . && cp /tmp/bd/store.json . && git add store.json
          git -c user.name=bench -c user.email=bench@x commit -qm "bench ${GITHUB_SHA}" && git -c credential.helper= push -f origin bench-data-new:bench-data
