name: ram-report
on: workflow_dispatch
jobs:
  report:
    runs-on: [self-hosted, mclite]
    timeout-minutes: 5
    steps:
      - name: ram report (read-only)
        shell: powershell
        run: |
          # RAM-REPORT: read-only. Writes _status\ram-report.txt (what is holding RAM). Closes nothing.
          $ErrorActionPreference = 'SilentlyContinue'
          
          $L = New-Object System.Collections.Generic.List[string]
          $os = Get-CimInstance Win32_OperatingSystem
          $tot = $os.TotalVisibleMemorySize / 1MB; $free = $os.FreePhysicalMemory / 1MB
          $L.Add(("{0}  total {1:N1} GB, free {2:N1} GB, used {3:N1} GB" -f (Get-Date -Format s), $tot, $free, ($tot - $free)))
          $L.Add('')
          $c = Get-Counter '\Memory\Pool Nonpaged Bytes','\Memory\Pool Paged Bytes','\Memory\Standby Cache Normal Priority Bytes','\Memory\Standby Cache Reserve Bytes','\Memory\Standby Cache Core Bytes','\Memory\Modified Page List Bytes','\Memory\Free & Zero Page List Bytes','\Memory\Committed Bytes','\Memory\Cache Bytes'
          foreach ($s in $c.CounterSamples) { $L.Add(("{0,-48} {1,8:N2} GB" -f ($s.Path -replace '^.*\\memory\\',''), ($s.CookedValue / 1GB))) }
          $L.Add(''); $L.Add('--- top 25 processes by working set (all users) ---')
          Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 25 | ForEach-Object { $L.Add(("{0,8:N0} MB ws  {1,8:N0} MB private  pid {2,6}  {3}" -f ($_.WorkingSet64/1MB), ($_.PrivateMemorySize64/1MB), $_.Id, $_.ProcessName)) }
          $L.Add(''); $L.Add('--- processes grouped by name (sum of working sets), top 12 ---')
          Get-Process | Group-Object ProcessName | ForEach-Object { [pscustomobject]@{N=$_.Name; C=$_.Count; MB=($_.Group | Measure-Object WorkingSet64 -Sum).Sum/1MB} } | Sort-Object MB -Descending | Select-Object -First 12 | ForEach-Object { $L.Add(("{0,8:N0} MB  x{1,-3} {2}" -f $_.MB, $_.C, $_.N)) }
          $L.Add(''); $L.Add('--- java / javaw command lines ---')
          Get-CimInstance Win32_Process -Filter "Name like 'java%'" | ForEach-Object { $L.Add(("pid {0} ws {1:N0} MB  {2}" -f $_.ProcessId, ($_.WorkingSetSize/1MB), ($_.CommandLine.Substring(0,[Math]::Min(300,$_.CommandLine.Length))))) }
          $L.Add(''); $L.Add('--- Hyper-V VMs ---')
          Get-VM | ForEach-Object { $L.Add(("{0} state {1} assigned {2:N1} GB demand {3:N1} GB startup {4:N1} GB max {5:N1} GB dynamic {6}" -f $_.Name, $_.State, ($_.MemoryAssigned/1GB), ($_.MemoryDemand/1GB), ($_.MemoryStartup/1GB), ($_.MemoryMaximum/1GB), $_.DynamicMemoryEnabled)) }
          $L.Add(''); $L.Add('--- RAM disks / big memory-backed volumes ---')
          Get-Volume | Where-Object { $_.DriveType -eq 'Fixed' -or $_.FileSystemLabel -match 'ram' } | ForEach-Object { $L.Add(("{0} {1} {2:N1} GB" -f $_.DriveLetter, $_.FileSystemLabel, ($_.Size/1GB))) }
          $L.Add(''); $L.Add('--- page file ---')
          Get-CimInstance Win32_PageFileUsage | ForEach-Object { $L.Add(("{0} allocated {1} MB in use {2} MB peak {3} MB" -f $_.Name, $_.AllocatedBaseSize, $_.CurrentUsage, $_.PeakUsage)) }
          $L | ForEach-Object { Write-Output $_ }
          
          
